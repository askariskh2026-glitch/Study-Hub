<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device, intial-scale=1.0">
        <title>Tasks-Study Hub</title>

        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
            }
            body{
                background: #f4f7fb;
                color: #222;
                padding: 30px;
            }
            
            /*SIDEBAR*/
            
           .sidebar {
             position: fixed;
             left: 0; 
             top: 0;
             width: 75px;
             height: 100vh; 
             background: #4f46e5; 
             display: flex; 
             flex-direction: column; 
             align-items: center; 
             padding-top: 20px; 
             box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1); 
             z-index: 1000; 
             overflow-y: auto; 
             overflow-x: hidden; }

             /*PROFILE*/

             .profile-section {
                display: flex;
                flex-direction: column;
                align-items: center;
                flex-shrink: 0;
             }

             .profile-link {
                text-decoration: none;
             }

             .profile-pic{
                width:48px;
                height: 48px;
                border-radius: 50%;
                background:white;

                display: flex;
                align-items: center;
                justify-content: center;

                font-size: 25px;
             }
             .profile-text {
                color:white;
                font-size: 11px;
                margin-top: 5px;
             }

             /* SIDEBAR */

             .sidebar a {
                width: 50px;
                height: 50px;

                display: flex;
                align-items: center;
                justify-content: center;

                color:white;
                font-size: 25px;

                border-radius: 12px;
                text-decoration: none;

                flex-shrink: 0;
             }

             .sidebar a:hover {
                background:rgba(255,255,255,255,0.2)
             }

             /*MAIN NAVIGATION */

             .nav-icons {
                display:flex;
                flex-direction: column;
                align-items: center;
                gap:15px;
                margin-top: 100px;
             }

             /* SETTINGS */

             .bottom-icons {
                margin-top: auto;
                padding-top: 20px;
                flex-shrink: 0;
             }

             /* MAIN CONTAINER */

             .container {
                max-width: 1100px;
                margin:auto;
                margin-left: 100px;
             }

             /* TOP HEADER */

             .header{
                background:linear-gradient(135deg, #4f46e5, #7c3aed);
                color:white;

                padding: 35px;
                border-radius: 20px;
                margin-bottom:25px;

                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            }


              .header h1 {
                font-size: 32px;
                margin-bottom: 10px;
            }

              .header p {
                font-size: 17px;
            }

             /* TASKS*/

             .tasks {
                background:white;
                padding:25px;
                border-radius:18px;

                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
            }

            .tasks h2 {
                margin-bottom: 20px;
            }

            .task {
                display:flex;
                align-items: center;

                padding: 18px 10px;
                border-bottom:1px solid #eeeeee;
                font-size: 16px;
            }

            .task:last-child {
                border-bottom: none;
            }

            .task input {
                width:18px;
                height:18px;
                margin-right:12px;
                cursor:pointer;
            }

            /* ADD TASK BUTTON */

            .add-task {
                margin-top: 20px;

                background:#4f46e5;
                color:white;
                
                border:none;
                padding:12px 20px;

                border-radius: 10px;
                font-size: 16px;

                cursor:pointer;
            }

            .add-task:hover {
                background: #3730a3;
            }

            /* PHONE */

            @media (max-width: 800px) {
                body{
                    padding:15px
                }
                .container {
                    margin-left: 85px;
                }
            }

        </style>
    </head>
    <body>
        
        <!--SIDEBAR-->

        <div class="sidebar">

            <!--PROFILE / Login-->

            <div class="profile-section">
                <a href="login.html" class="profile-link" title="Login">
                    <div class="profile-pic">👤</div>
                </a>
              
                <span class="profile-text">Login</span>
            </div>
            
            <!--MAIN ICONS-->

            <div class="nav-icons">
                <a href="index.html" title="Home">🏠</a>
                <a href="tasks.html" title="Tasks">✅</a>
                <a href="studytime.html" title="Timer">⏱️</a>
                <a href="schedule.html" title="Schedule">📅</a>
                <a href="progress.html" title="Progress">📊</a>
            </div>
            
            <!--SETTINGS-->

              <div class="bottom-icons">
                <a href="settings.html" title="Settings">⚙️</a>
              </div>
            
        </div>

            <!--MAIN PAGE-->
               <div class="container">

    <div class="header">
        <h1>Tasks</h1>
        <p>Manage your study tasks and stay organized.</p>
    </div>

    <div class="tasks">
        <h2>My Tasks</h2>

        <div class="task">
            <input type="checkbox" onclick="hideTask(this)">
            <span>Complete Maths Homework</span>
        </div>

        <div class="task">
            <input type="checkbox" onclick="hideTask(this)">
            <span>Complete Science Quiz</span>
        </div>

        <div class="task">
            <input type="checkbox" onclick="hideTask(this)">
            <span>Review English Notes</span>
        </div>

        <button class="add-task" onclick="showTaskInput()">+ Add Task</button>
        <div id="taskInputArea" style="display:none; margin-top:15px;">
        <input
            type="text"
            id="newTaskInput"
            placeholder="Write your task and press enter"
            onkeydown="addTask(event)"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:16px;"
            >
        </div>   
        </div>



</div>
    <script>
        function showTaskInput() {
            document.getElementById("taskInputArea").style.display="block";
            document.getElementById("newTaskInput").focus();
        }
        function addTask(event) {
            if(event.key==="Enter") {
                let input= document.getElementById("newTaskInput");
                let taskText = input.value.trim();
                if (taskText==="") {
                    return;
                }
                let task = document.createElement("div");
                task.className = "task"; 

                 task.innerHTML = `
            <input type="checkbox" onclick="hideTask(this)">
            <span>${taskText}</span>
            `;

            document.querySelector(".tasks").insertBefore(
                task,
                document.querySelector(".add-task")
            );

            input.value = "";
            document.getElementById(taskInputArea).style.display="none";
            }
        }

        function hideTask(checkbox) {
    if (checkbox.checked) {
        checkbox.parentElement.style.display = "none";
    }
    }
    </script>
    </body>
    </html>
