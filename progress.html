 <!DOCTYPE html>
 <html lang="en">
    <head> <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0"> <title> Progress-StudyHub </title>
    
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4f7fb;
            color: #222;
            padding: 30px;
        }

        /*--SIDEBAR--*/

        .sidebar { 
            position: fixed; 
            left: 0; 
            top: 0; 
            width: 75px; 
            height: 100vh;
            background: #4f46e5; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            padding-top: 20px; 
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1); 
            z-index: 1000; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* PROFILE */

        .profile-section {
            display:flex;
            flex-direction: column;
            align-items:center;
            flex-shrink:0;
        }

        .profile-link {
            text-decoration: none;
        }

        .profile-pic {
            width:48px;
            height:48px;
            border-radius: 50%;
            background:white;
            display:flex;
            align-items:center;
            justify-items: center;
            font-size:25px;
        }

        .profile-text {
            color:white;
            font-size: 11px;
            margin-top: 5px;
        }
